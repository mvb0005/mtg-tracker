apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtgtracker
  labels:
    app: mtgtracker
spec:
  # One pod: SQLite is the database. Rollouts overlap the old and new pod
  # for a few seconds so deploys have no downtime: the new pod gets traffic
  # only once /healthz is ready, then the old one drains and stops. That's
  # safe only because minikube is a single node -- ReadWriteOnce is per node,
  # so both pods can mount the volume, and SQLite's file locking works across
  # processes on a local disk. On a multi-node cluster this must go back to
  # Recreate. A migration runs in the new pod while the old code still
  # serves, so a migration that rewrites a table should be deployed with
  # Recreate (see CLAUDE.md).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: mtgtracker
  template:
    metadata:
      labels:
        app: mtgtracker
    spec:
      # Room for the preStop pause plus in-flight requests.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: web
          image: mtgtracker:dev
          imagePullPolicy: Never  # built straight into minikube's runtime
          command:
            - mtg
            - serve
            - --db
            - /data/mtgtracker.db
            - --host
            - 0.0.0.0
            - --port
            - "8000"
          # Sign-in mode etc. (web/auth.py); written by `minikube.sh up` from
          # .env. Optional so a missing ConfigMap means MTG_AUTH unset = single.
          envFrom:
            - configMapRef:
                name: mtgtracker-auth
                optional: true
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: data
              mountPath: /app/.scryfall_cache
              subPath: scryfall_cache
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              # Keep serving while the Service and cloudflared stop routing
              # here, so no request lands on a pod that's shutting down.
              exec:
                command: ["sleep", "5"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mtgtracker-data
        - name: tmp
          emptyDir: {}
