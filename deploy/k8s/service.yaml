# ClusterIP only -- reach it locally with `deploy/minikube.sh forward`, or
# publicly through the optional Cloudflare Tunnel (deploy/k8s/tunnel/). No
# NodePort or Ingress.
apiVersion: v1
kind: Service
metadata:
  name: mtgtracker
spec:
  selector:
    app: mtgtracker
  ports:
    - name: http
      port: 80
      targetPort: http
