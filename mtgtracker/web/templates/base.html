<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}mtgtracker{% endblock %} · mtgtracker</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a class="brand" href="/">mtgtracker</a>
      {% set nav = [("/", "Overview", "dashboard"), ("/decks", "Decks", "decks"), ("/cards", "Cards", "cards"), ("/transactions", "Purchases", "transactions")] %}
      {% for href, label, key in nav %}
        <a href="{{ href }}"{% if active == key %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
