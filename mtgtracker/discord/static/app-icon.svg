<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="56%" r="62%">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="0.45" stop-color="#1c1714"/>
      <stop offset="1" stop-color="#0d0c0b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#ff5a14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ff5a14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.35" stop-color="#ffd166"/>
      <stop offset="0.75" stop-color="#ff8c2b"/>
      <stop offset="1" stop-color="#e2461a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b665d"/>
      <stop offset="0.12" stop-color="#47433c"/>
      <stop offset="1" stop-color="#211f1c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb35a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffb35a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffb35a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 512) scale(1.15) translate(-512 -552)">
    <ellipse cx="512" cy="470" rx="330" ry="300" fill="url(#glow)"/>

    <!-- the card, red hot on the anvil -->
    <g transform="rotate(-9 512 600)">
      <rect x="392" y="262" width="240" height="338" rx="26" fill="#ff7a22" filter="url(#blur)" opacity="0.9"/>
      <rect x="392" y="262" width="240" height="338" rx="26" fill="url(#hot)"/>
      <rect x="414" y="284" width="196" height="294" rx="14" fill="none" stroke="#fffaf0" stroke-opacity="0.6" stroke-width="7"/>
      <path d="M512 352 C 470 402 470 440 490 470 C 480 440 500 418 512 400 C 524 418 544 440 534 470 C 554 440 554 402 512 352 Z"
            fill="#fffaf0" fill-opacity="0.7"/>
    </g>

    <!-- sparks -->
    <g stroke="#ffd27a" stroke-linecap="round">
      <line x1="660" y1="560" x2="742" y2="500" stroke-width="10"/>
      <line x1="680" y1="590" x2="786" y2="566" stroke-width="8"/>
      <line x1="650" y1="530" x2="696" y2="452" stroke-width="7"/>
      <line x1="372" y1="580" x2="290" y2="526" stroke-width="9"/>
      <line x1="360" y1="608" x2="262" y2="598" stroke-width="7"/>
    </g>
    <g fill="#ffe3a3">
      <circle cx="770" cy="470" r="9"/>
      <circle cx="812" cy="530" r="6"/>
      <circle cx="252" cy="490" r="8"/>
      <circle cx="716" cy="414" r="6"/>
    </g>

    <!-- the anvil -->
    <path d="M262 612 L800 612 L800 640 Q800 690 742 694 L646 694 Q606 708 606 758 L606 790 Q626 812 700 828 L712 870 L312 870 L324 828 Q398 812 418 790 L418 758 Q418 708 378 694 L292 694 Q226 690 132 632 Q196 618 262 612 Z"
          fill="url(#steel)" stroke="#0b0a09" stroke-width="6" stroke-linejoin="round"/>
    <rect x="262" y="612" width="538" height="10" fill="url(#rim)"/>
  </g>
</svg>
