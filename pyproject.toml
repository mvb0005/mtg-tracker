[project]
name = "mtgtracker"
version = "0.1.0"
description = "Personal Magic: The Gathering collection and spending tracker"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
mtg = "mtgtracker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mtgtracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
