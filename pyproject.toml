[project]
name = "mtgtracker"
version = "0.1.0"
description = "Personal Magic: The Gathering collection and spending tracker"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
]

[project.scripts]
mtg = "mtgtracker.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mtgtracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = [".scryfall_cache"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, plus a few low-noise
# extras: simplify, comprehensions, pytest style, ruff-specific.
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented idiom is typer.Argument/Option as parameter defaults.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
